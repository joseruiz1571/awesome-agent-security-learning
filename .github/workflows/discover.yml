name: Discover learning resources
on:
  schedule:
    # Every Monday; the date gate runs discovery on alternating weeks.
    - cron: '23 13 * * 1'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview candidates in the run summary without creating a PR'
        type: boolean
        default: false
      without_web:
        description: 'Explicit partial test: skip Brave web search'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the fortnightly calendar
        id: calendar
        run: echo "due=$(python scripts/discover.py --gate)" >> "$GITHUB_OUTPUT"
      - name: Search and prepare additions
        if: github.event_name == 'workflow_dispatch' || steps.calendar.outputs.due == 'true'
        id: search
        env:
          GH_TOKEN: ${{ github.token }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          WITHOUT_WEB: ${{ inputs.without_web }}
        run: |
          args=()
          if [ "$WITHOUT_WEB" = "true" ]; then args+=(--without-web); fi
          python scripts/discover.py --apply "${args[@]}"
      - name: Validate the actual proposed catalog
        if: steps.search.outputs.count != '' && steps.search.outputs.count != '0'
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py
      - name: Open a review PR
        if: inputs.preview_only != true && steps.search.outputs.count != '' && steps.search.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="discovery/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/resources.json README.md
          git commit -m 'Propose newly discovered learning resources'
          gh auth setup-git
          git push origin "$branch"
          # Create the pull request before requesting review. CODEOWNERS already
          # requests joseruiz1571 as the PR opens. Combining --reviewer with
          # create makes gh exit 1 when requestReviewsByLogin fails, including
          # when that code-owner review is already present.
          pr_url=$(gh pr create --base main --head "$branch" --title "Review learning resources — $(date -u +%F)" --body-file work/proposal.md)
          echo "Opened ${pr_url}"
          reviewer=joseruiz1571
          if ! gh pr edit "$pr_url" --add-reviewer "$reviewer"; then
            echo "Review request for ${reviewer} was not accepted. Checking whether one is already present."
          fi
          present=false
          for attempt in 1 2 3; do
            reviewers=$(gh pr view "$pr_url" --json reviewRequests --jq '.reviewRequests[].login' || true)
            if printf '%s\n' "$reviewers" | grep -Fxq "$reviewer"; then
              present=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 2
            fi
          done
          if [ "$present" = true ]; then
            echo "Review request for ${reviewer} is present."
          else
            echo "::warning title=Review request did not stick::${reviewer} is not a requested reviewer on ${pr_url}"
            {
              echo "### Review request did not stick"
              echo
              echo "Opened ${pr_url}, but \`${reviewer}\` is not a requested reviewer."
              echo "Discovery still succeeded. Open the pull request to review the proposal."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
